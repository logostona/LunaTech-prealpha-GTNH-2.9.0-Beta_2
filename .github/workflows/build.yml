name: Build

on:
  push:
    branches: [main, "m1-*"]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5
        with:
          # The GTNH convention plugin derives the project version from git describe,
          # so it needs history and tags rather than a shallow checkout.
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # Staged so a failure says which thing broke: resolving GT5U, compiling,
      # the validation harness, or formatting. Output is teed to a log because
      # GitHub gates job logs behind repo auth, and the failure step below
      # republishes the relevant lines as annotations, which are public.
      - name: Compile
        run: |
          set -o pipefail
          ./gradlew --stacktrace compileJava compileTestJava 2>&1 | tee -a gradle-output.log

      - name: Validation harness
        run: |
          set -o pipefail
          ./gradlew --stacktrace test 2>&1 | tee -a gradle-output.log

      - name: Full build
        run: |
          set -o pipefail
          ./gradlew --stacktrace build 2>&1 | tee -a gradle-output.log

      - name: Surface failure as annotations
        if: failure()
        run: |
          if [ ! -f gradle-output.log ]; then
            echo "::error::No gradle output captured; the failure happened before Gradle ran."
            exit 0
          fi
          echo "::group::Last 150 lines"
          tail -n 150 gradle-output.log
          echo "::endgroup::"
          grep -nE "error:|FAILURE:|Caused by:|Could not |Execution failed|\.java:[0-9]+|Unresolved|cannot find symbol" \
            gradle-output.log | head -n 30 | while IFS= read -r line; do
              clean=$(printf '%s' "$line" | tr -d '\r' | sed 's/%/%25/g; s/\r/%0D/g')
              echo "::error::${clean}"
            done

      # Spotless can only be satisfied by matching GTNH's exact formatter output, and there
      # is no JDK on the dev machine to run spotlessApply locally. So let CI compute the
      # diff and publish it, since annotations are readable without repository auth.
      - name: Show required formatting changes
        if: failure()
        run: |
          ./gradlew spotlessApply --quiet || true
          if git diff --quiet; then
            echo "No spotless changes; the failure was something else."
            exit 0
          fi
          echo "::group::spotless diff"
          git --no-pager diff
          echo "::endgroup::"
          # GitHub caps annotations at 10 per step, which silently truncates a
          # line-per-annotation diff and hides later files. Emit the whole diff as a
          # single annotation instead, with newlines percent-encoded.
          DIFF=$(git --no-pager diff | head -c 8000 \
            | tr -d '\r' \
            | sed 's/%/%25/g' \
            | sed ':a;N;$!ba;s/\n/%0A/g')
          echo "::error::SPOTLESS DIFF%0A${DIFF}"

      - name: Upload logs and test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-output
          path: |
            gradle-output.log
            build/reports/
          if-no-files-found: ignore
