dependencies {
    // GregTech 5 Unofficial, exactly as shipped in GTNH 2.9.0-beta2.
    // Pinned deliberately: every value in UNITS.md and AUDIT.md was read from this build.
    // Bumping this version invalidates the audit until it is re-verified.
    api("com.github.GTNewHorizons:GT5-Unofficial:5.09.52.594:dev")

    // Gson comes from Minecraft at runtime, but the test source set does not get Minecraft,
    // so the dataset harness needs it declared. Version matches what MC 1.7.10 ships.
    testImplementation("com.google.code.gson:gson:2.2.4")

    testImplementation(platform("org.junit:junit-bom:5.14.1"))
    testImplementation("org.junit.jupiter:junit-jupiter")
    testRuntimeOnly("org.junit.platform:junit-platform-launcher")
}
