# ExampleMod tag used as Blowdryer (Spotless, etc.) settings version. Matches GT5U.
gtnh.settings.blowdryerTag = 0.2.2

modName = LunaTech
modId = lunatech
modGroup = lunatech

useModGroupForPublishing = false
autoUpdateBuildScript = false

# Target platform: GTNH 2.9.0-beta2. These must match GT5U 5.09.52.594.
minecraftVersion = 1.7.10
forgeVersion = 10.13.4.1614
channel = stable
mappingsVersion = 12
remoteMappings = https\://raw.githubusercontent.com/MinecraftForge/FML/1.7.10/conf/

developmentEnvironmentUserName = Developer

# Matches GT5U's own configuration so we compile the same way as the mod we extend.
enableModernJavaSyntax = jvmDowngrader
downgradeTargetVersion = 8
jvmDowngraderMultiReleaseVersions = 17,21,25
jvmDowngraderStubsProvider = gtnhlib

enableGenericInjection = true

generateGradleTokenClass = lunatech.Tags
gradleTokenVersion = VERSION

apiPackage =
accessTransformersFile =

# D2 resolved: mixins are on. GregTech appends unit labels in Java for some tooltips, so those
# strings cannot be reached by a language-file override. This is where LunaTech starts modifying
# GregTech behaviour rather than only adding to it. UniMixins is pulled in automatically.
usesMixins = true
separateMixinSourceSet =
usesMixinDebug = false
mixinPlugin =
mixinsPackage = mixins
coreModClass =
containsMixinsAndOrCoreModOnly = false
forceEnableMixins = false

usesShadowedDependencies = false
minimizeShadowedDependencies = true
relocateShadowedDependencies = true

includeWellKnownRepositories = true
excludeWellKnownRepositories =

# Nothing is published during pre-alpha.
usesMavenPublishing = false
modrinthProjectId =
modrinthRelations =
curseForgeProjectId =
curseForgeRelations =

org.gradle.jvmargs = -Xmx2g
org.gradle.parallel = true
